<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phòng nghe — English for Doctors</title>
<style>
:root{
  --navy:#1B2445; --navy2:#2B3763; --blue:#4E67C8; --blueLt:#CADCFC;
  --blueBg:#EDF3FC; --cyan:#5ECCF3; --orange:#E4572E;
  --bg:#F4F7FD; --card:#FFFFFF; --ink:#1F2430; --muted:#5D6B8A; --line:#D3DEF1;
}
:root:not([data-theme="light"]) { @media (prefers-color-scheme: dark){
  --bg:#11162A; --card:#1A2140; --ink:#E8EDF9; --muted:#93A1C4; --line:#2E3A62;
  --blueBg:#1F2A4D; --blueLt:#3A4B86;
}}
:root[data-theme="dark"]{
  --bg:#11162A; --card:#1A2140; --ink:#E8EDF9; --muted:#93A1C4; --line:#2E3A62;
  --blueBg:#1F2A4D; --blueLt:#3A4B86;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Segoe UI',Calibri,system-ui,-apple-system,sans-serif;
  line-height:1.55; -webkit-text-size-adjust:100%;
}
header{background:var(--navy); color:#fff; padding:22px 16px 18px}
.wrap{max-width:860px; margin:0 auto; padding:0 16px}
header .wrap{padding:0 16px}
h1{font-family:Cambria,Georgia,serif; font-size:1.5rem; margin:0 0 4px}
header p{margin:0; color:var(--blueLt); font-size:.9rem}
.themebtn{
  position:absolute; top:18px; right:16px; background:rgba(255,255,255,.14);
  border:0; color:#fff; border-radius:8px; padding:7px 11px; cursor:pointer; font-size:.85rem;
}
header{position:relative}

nav{background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5}
nav .wrap{display:flex; gap:6px; overflow-x:auto; padding:10px 16px; scrollbar-width:thin}
nav button{
  flex:0 0 auto; border:1px solid var(--line); background:transparent; color:var(--muted);
  border-radius:999px; padding:7px 15px; cursor:pointer; font-size:.88rem; font-weight:600;
  white-space:nowrap;
}
nav button[aria-selected="true"]{background:var(--blue); border-color:var(--blue); color:#fff}

main{padding:6px 0 60px}
.searchbar{display:flex; align-items:center; gap:10px; padding-top:18px}
.searchbar input{
  flex:1; min-width:0; background:var(--card); color:var(--ink);
  border:1px solid var(--line); border-radius:10px; padding:10px 13px; font-size:.92rem;
  font-family:inherit;
}
.searchbar input:focus{outline:2px solid var(--blue); outline-offset:1px}
#cnt{color:var(--muted); font-size:.82rem; flex:0 0 auto}
.lead .fc{font-size:.86rem; opacity:.9}
.intro{margin:-6px 0 16px}
.lead{
  background:var(--blueBg); border-left:4px solid var(--blue); border-radius:10px;
  padding:13px 16px; margin:0 0 20px; font-size:.93rem; color:var(--navy2);
}
:root[data-theme="dark"] .lead,
:root:not([data-theme="light"]) .lead{color:var(--ink)}
h2{font-family:Cambria,Georgia,serif; font-size:1.18rem; margin:26px 0 4px; color:var(--blue)}
.sub{margin:0 0 14px; color:var(--muted); font-size:.88rem}

.grid{display:grid; gap:10px; grid-template-columns:repeat(auto-fill,minmax(248px,1fr))}
.w{
  background:var(--card); border:1px solid var(--line); border-radius:12px;
  padding:12px 13px; display:flex; align-items:center; gap:11px;
}
.w .txt{flex:1; min-width:0}
.w b{display:block; font-size:1.05rem; font-weight:700; color:var(--ink); word-break:break-word}
.txt .ipa{display:block; font-size:.9rem; color:var(--blue); font-family:'Segoe UI',sans-serif}
.txt .vi{display:block; font-size:.82rem; color:var(--muted)}
.spk{
  flex:0 0 auto; width:42px; height:42px; border-radius:50%; border:0; cursor:pointer;
  background:var(--blue); color:#fff; font-size:1.1rem; display:grid; place-items:center;
  transition:transform .12s;
}
.spk:hover{transform:scale(1.07)}
.spk:disabled{opacity:.45; cursor:progress}
.spk.tts{background:var(--muted)}
.cam{
  flex:0 0 auto; font-size:.72rem; color:var(--muted); text-decoration:none;
  border:1px solid var(--line); border-radius:7px; padding:4px 7px; line-height:1.2; text-align:center;
}
.cam:hover{color:var(--blue); border-color:var(--blue)}

.pair{
  grid-column:1 / -1;
  background:var(--card); border:1px solid var(--line); border-radius:12px;
  padding:12px 15px; display:flex; align-items:center; gap:14px;
}
.pair .side{display:flex; align-items:center; gap:10px; flex:1 1 0; min-width:0}
.pair .vs{color:var(--orange); font-weight:700; font-size:.8rem; flex:0 0 auto; letter-spacing:.04em}
@media(max-width:560px){
  .pair{flex-direction:column; align-items:stretch; gap:8px}
  .pair .vs{text-align:center}
}

.note{
  margin-top:26px; background:var(--card); border:1px solid var(--line);
  border-left:4px solid var(--orange); border-radius:10px; padding:13px 16px; font-size:.88rem;
}
.note b{color:var(--orange)}
footer{text-align:center; color:var(--muted); font-size:.8rem; padding:26px 16px 40px}
footer a{color:var(--blue)}
.soon{color:var(--muted); font-style:italic; padding:24px 0}
@media(max-width:480px){
  .cam{display:none}
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>Phòng nghe</h1>
    <p>English for Doctors · nghe lại phát âm chuẩn từ điển</p>
  </div>
  <button class="themebtn" id="tbtn">🌙 Tối</button>
</header>

<nav><div class="wrap" id="tabs" role="tablist"></div></nav>

<div class="wrap searchbar">
  <input id="q" type="search" placeholder="Tìm từ trong buổi này… (ví dụ: patient)" autocomplete="off">
  <span id="cnt"></span>
</div>

<main class="wrap" id="body"></main>

<footer>
  Nhấn vòng tròn xanh để nghe. Nút xám là giọng máy của trình duyệt — khi từ điển chưa có bản thu.<br>
  Bản thu chuẩn luôn có ở
  <a href="https://dictionary.cambridge.org/" target="_blank" rel="noopener">Cambridge Dictionary</a>.
</footer>

/* ---------- PHÁT ÂM ---------- */
const cache = new Map();

/* Chỉ gọi từ điển cho từ đơn. Cụm nhiều từ dùng giọng máy. */
async function dictAudio(word){
  if (cache.has(word)) return cache.get(word);
  let url = null;
  if (/^[a-zA-Z'-]+$/.test(word)) {
    try{
      const r = await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'
                            + encodeURIComponent(word.toLowerCase()));
      if (r.ok) {
        const d = await r.json();
        const ph = [];
        for (const e of (Array.isArray(d) ? d : [])) for (const p of (e.phonetics || [])) {
          if (p && p.audio) ph.push(p.audio);
        }
        /* ưu tiên bản thu Anh-Anh */
        url = ph.find(u => /-uk\.|\/uk\//i.test(u)) || ph[0] || null;
      }
    }catch(e){ url = null; }
  }
  cache.set(word, url);
  return url;
}

let voice = null;
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v => v.lang === 'en-GB') || vs.find(v => v.lang && v.lang.startsWith('en')) || null;
}
if (window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

function speak(word){
  if (!window.speechSynthesis) return false;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(word);
  u.lang = 'en-GB'; u.rate = .82;
  if (voice) u.voice = voice;
  speechSynthesis.speak(u);
  return true;
}

async function play(btn, word){
  btn.disabled = true;
  const prev = btn.textContent;
  btn.textContent = '⋯';
  const url = await dictAudio(word);
  btn.disabled = false;
  if (url){
    btn.classList.remove('tts');
    btn.textContent = '🔊';
    const a = new Audio(url);
    a.play().catch(() => { btn.classList.add('tts'); btn.textContent = '🔉'; speak(word); });
  } else {
    btn.classList.add('tts');
    btn.textContent = '🔉';
    if (!speak(word)) btn.textContent = prev;
  }
}

/* ---------- DỰNG TRANG ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* dùng ô tìm trực tiếp của Cambridge: an toàn với cả từ số nhiều / chia thì */
const camUrl = w => 'https://dictionary.cambridge.org/search/english/direct/?q='
  + encodeURIComponent(w.toLowerCase().trim());

function node([word, ipa, vi, say], cls){
  const d = document.createElement('div'); d.className = cls;
  const single = /^[a-zA-Z'’-]+$/.test(word);
  d.innerHTML =
    '<button class="spk" aria-label="Nghe ' + esc(word) + '">🔊</button>' +
    '<div class="txt"><b>' + esc(word) + '</b>' +
      '<span class="ipa">' + esc(ipa || '') + '</span>' +
      '<span class="vi">' + esc(vi || '') + '</span></div>' +
    (single && cls === 'w'
      ? '<a class="cam" target="_blank" rel="noopener" href="' + camUrl(word) + '">Cam<br>bridge</a>'
      : '');
  const txt = say || word;
  d.querySelector('.spk').addEventListener('click', e => play(e.currentTarget, txt));
  return d;
}

function render(no){
  const body = document.getElementById('body');
  body.innerHTML = '';
  const les = L[no];
  if (!les){ body.innerHTML = '<p class="soon">Buổi này chưa có nội dung nghe.</p>'; return; }

  const lead = document.createElement('div');
  lead.className = 'lead';
  lead.innerHTML = '<b>Buổi ' + les.no + ' — ' + esc(les.name) + '</b><br>'
    + '<span class="fc">Trọng tâm: ' + esc(les.focus) + '</span>'
    + (les.goal ? '<br><span class="fc">' + esc(les.goal) + '</span>' : '');
  body.appendChild(lead);

  if (les.intro){
    const i = document.createElement('p'); i.className = 'sub intro'; i.textContent = les.intro;
    body.appendChild(i);
  }

  for (const b of les.blocks){
    const h = document.createElement('h2'); h.textContent = b.h; body.appendChild(h);
    if (b.s){ const s = document.createElement('p'); s.className = 'sub'; s.textContent = b.s; body.appendChild(s); }
    const g = document.createElement('div'); g.className = 'grid';
    for (const w of (b.words || [])) g.appendChild(node(w, 'w'));
    for (const [x, y] of (b.pairs || [])){
      const p = document.createElement('div'); p.className = 'pair';
      p.appendChild(node(x, 'side'));
      const vs = document.createElement('span'); vs.className = 'vs'; vs.textContent = 'vs';
      p.appendChild(vs);
      p.appendChild(node(y, 'side'));
      g.appendChild(p);
    }
    body.appendChild(g);
  }

  const n = document.createElement('div'); n.className = 'note';
  n.innerHTML = '<b>Cách luyện:</b> nghe một từ ba lần, rồi tự đọc lại và ghi âm bằng điện thoại. '
    + 'Nghe bản ghi của mình cạnh bản từ điển — chỗ khác nhau nghe ra ngay.';
  body.appendChild(n);
  filter();
}

/* ---------- TÌM TỪ ---------- */
function filter(){
  const q = (document.getElementById('q').value || '').trim().toLowerCase();
  let hits = 0;
  for (const card of document.querySelectorAll('#body .w, #body .pair')){
    const show = !q || card.textContent.toLowerCase().includes(q);
    card.style.display = show ? '' : 'none';
    if (show) hits++;
  }
  for (const h of document.querySelectorAll('#body h2')){
    let el = h.nextElementSibling, grid = null;
    while (el && !grid){ if (el.classList.contains('grid')) grid = el; el = el.nextElementSibling; }
    const vis = grid && [...grid.children].some(c => c.style.display !== 'none');
    h.style.display = vis ? '' : 'none';
    if (h.nextElementSibling && h.nextElementSibling.classList.contains('sub'))
      h.nextElementSibling.style.display = vis ? '' : 'none';
  }
  document.getElementById('cnt').textContent = q ? (hits + ' kết quả') : '';
}
document.getElementById('q').addEventListener('input', filter);

/* ---------- TAB ---------- */
const tabs = document.getElementById('tabs');
function go(no){
  [...tabs.children].forEach((x, i) => x.setAttribute('aria-selected', String(i + 1 === no)));
  render(no);
  history.replaceState(null, '', '#b' + no);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
for (let i = 1; i <= TOTAL; i++){
  const btn = document.createElement('button');
  btn.type = 'button'; btn.setAttribute('role', 'tab');
  btn.textContent = 'Buổi ' + i;
  btn.title = (L[i] && L[i].name) || '';
  btn.addEventListener('click', () => go(i));
  tabs.appendChild(btn);
}
const m = /^#b(\d{1,2})$/.exec(location.hash);
go(m && L[+m[1]] ? +m[1] : 1);

/* ---------- SÁNG / TỐI ---------- */
const tbtn = document.getElementById('tbtn');
function readTheme(){ try{ return localStorage.getItem('pn-theme'); }catch(e){ return null; } }
function applyTheme(t){
  if (t) document.documentElement.setAttribute('data-theme', t);
  else document.documentElement.removeAttribute('data-theme');
  const dark = t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches);
  tbtn.textContent = dark ? '☀️ Sáng' : '🌙 Tối';
}
applyTheme(readTheme());
tbtn.addEventListener('click', () => {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark'
    || (!document.documentElement.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
  const next = dark ? 'light' : 'dark';
  try{ localStorage.setItem('pn-theme', next); }catch(e){}
  applyTheme(next);
});
</script>
